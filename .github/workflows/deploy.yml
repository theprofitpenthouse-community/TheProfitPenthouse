name: Deploy to GitHub Pages

# Builds the site from source and publishes it to theprofitpenthouse.com.
# Runs on every push to `new-site` (the source branch), or by hand from the Actions tab.
# Requires Settings → Pages → Source = "GitHub Actions", and `new-site` allowed
# under Settings → Environments → github-pages → Deployment branches.
on:
  push:
    branches: [new-site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The Penthouse Suite (public/suite.html) has no source in this repo; it is copied
      # into dist/ as-is. Fail the deploy rather than publish a site missing a page.
      - name: Check every page made it into the build
        run: |
          for f in index.html tools.html inner-circle.html roadmap.html waitlist.html founding.html community.html suite.html CNAME; do
            test -s "dist/$f" || { echo "::error::dist/$f is missing or empty"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
